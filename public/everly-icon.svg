<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Cosmic Gradient -->
    <radialGradient id="spaceBg" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141a2e" />
      <stop offset="55%" stop-color="#0a0d17" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Border Ring Glow -->
    <linearGradient id="cosmicBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.9" />
    </linearGradient>

    <!-- Core E Emblem Gradient (Backbone & Bars) -->
    <linearGradient id="eGrad" x1="15%" y1="15%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fbcfe8" />
      <stop offset="55%" stop-color="#f43f5e" />
      <stop offset="80%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Orbital Cosmic Ribbon Front Gradient -->
    <linearGradient id="ribbonFront" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#c084fc" />
      <stop offset="85%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Orbital Cosmic Ribbon Back (Depth Shadow) -->
    <linearGradient id="ribbonBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#4c1d95" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Golden Starlight Gradient -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Core Glow Behind E -->
    <radialGradient id="ambientNebula" cx="48%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#8b5cf6" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Crisp Drop Shadow for small favicon legibility -->
    <filter id="crispShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.75" />
    </filter>
  </defs>

  <!-- 1. Cosmic Container Squircle (Ensures high contrast on both light and dark browser chrome) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#spaceBg)" />
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#cosmicBorder)" stroke-width="8" stroke-opacity="0.9" />

  <!-- 2. Ambient Nebula Core Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#ambientNebula)" />

  <!-- 3. Back Orbital Loop (passes behind the E) -->
  <path d="M 125 315 C 95 260 135 180 235 145 C 325 112 400 135 418 178 C 426 198 420 220 400 242" 
        fill="none" 
        stroke="url(#ribbonBack)" 
        stroke-width="20" 
        stroke-linecap="round" 
        opacity="0.65" />

  <!-- 4. The Cosmic "E" Emblem Architecture -->
  <g filter="url(#crispShadow)">
    <!-- Vertical Backbone of E with sleek tapered cuts -->
    <path d="M 172 136 
             C 152 136 136 152 136 172 
             L 136 340 
             C 136 360 152 376 172 376 
             L 204 376 
             C 214 376 222 368 222 358 
             L 222 154 
             C 222 144 214 136 204 136 
             Z" 
          fill="url(#eGrad)" />

    <!-- Top Arm: sweeps out with cosmic energy and gold-rose wing tip -->
    <path d="M 204 136 
             L 348 136 
             C 366 136 378 148 376 164 
             C 374 178 360 188 344 188 
             L 222 188 
             L 222 136 
             Z" 
          fill="url(#eGrad)" />

    <!-- Middle Arm: streamlined with orbital ribbon crossover -->
    <path d="M 218 234 
             L 308 234 
             C 324 234 336 244 336 256 
             C 336 268 324 278 308 278 
             L 218 278 
             Z" 
          fill="url(#eGrad)" />

    <!-- Bottom Arm: graceful celestial return with subtle lift -->
    <path d="M 204 324 
             L 348 324 
             C 364 324 376 335 378 349 
             C 379 364 367 376 350 376 
             L 172 376 
             C 172 376 204 376 204 324 
             Z" 
          fill="url(#eGrad)" />
  </g>

  <!-- 5. Front Orbital Ribbon: swoops gracefully over the E, connecting the cosmic rings -->
  <path d="M 102 345 
           C 130 405 210 425 295 395 
           C 365 370 415 315 424 255 
           C 428 228 418 202 396 186" 
        fill="none" 
        stroke="url(#ribbonFront)" 
        stroke-width="26" 
        stroke-linecap="round" 
        filter="url(#crispShadow)" />

  <!-- Inner Shimmer along the ribbon -->
  <path d="M 125 352 
           C 152 400 220 416 295 388 
           C 358 364 402 316 414 264" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" 
        opacity="0.8" />

  <!-- 6. Starlight / Nova Gem Accent (top right cosmic flare) -->
  <g transform="translate(390, 138)">
    <!-- Radial flare -->
    <circle cx="0" cy="0" r="32" fill="url(#starGlow)" />
    <!-- 4-point Diamond Star -->
    <path d="M 0 -26 Q 0 0 26 0 Q 0 0 0 26 Q 0 0 -26 0 Q 0 0 0 -26 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="4.5" fill="#fef08a" />
  </g>

  <!-- Secondary micro-sparkle for depth and balance -->
  <g transform="translate(122, 168)">
    <path d="M 0 -10 Q 0 0 10 0 Q 0 0 0 10 Q 0 0 -10 0 Q 0 0 0 -10 Z" fill="#fbcfe8" opacity="0.9" />
  </g>

  <g transform="translate(325, 256)">
    <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
