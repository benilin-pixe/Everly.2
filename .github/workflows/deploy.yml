name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Dump npm debug log on install failure
        if: failure() && steps.install.outcome == 'failure'
        run: |
          echo "=== Printing npm debug log (redacting any credentials) ==="
          for f in ~/.npm/_logs/*.log; do
            if [ -f "$f" ]; then
              echo "--- Log: $f ---"
              sed -E 's/(bearer [a-zA-Z0-9_\.\-]+)/bearer [REDACTED]/gI; s/(token: [a-zA-Z0-9_\.\-]+)/token: [REDACTED]/gI; s/(key: [a-zA-Z0-9_\.\-]+)/key: [REDACTED]/gI' "$f" | tail -n 200
            fi
          done

      - name: Run Type Check & Lint
        run: npx tsc --noEmit

      - name: Build Application
        run: npm run build

      - name: Run Tests
        run: npm test
