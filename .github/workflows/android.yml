name: Build Everly Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies using Bun lockfile
        run: bun install

      - name: Build web application
        run: bun run build

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Grant execute permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK with Gradle
        run: ./android/gradlew assembleDebug --stacktrace -p android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: everly-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
